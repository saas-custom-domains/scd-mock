name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: scd-mock:ci
      - name: Smoke test the image
        run: |
          docker run -d --name scd-mock -p 4010:4010 scd-mock:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:4010/_mock/health && exit 0
            sleep 1
          done
          docker logs scd-mock
          exit 1
